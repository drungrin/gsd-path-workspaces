name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no 3.9 build for Ubuntu 26.04 (ubuntu-latest).
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: drungrin/gsd-path
          path: gsd-path
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          GSD_PATH_SOURCE: ${{ github.workspace }}/gsd-path
        run: python -m unittest discover -s tests -t tests -v
